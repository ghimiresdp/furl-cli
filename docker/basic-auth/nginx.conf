server {
    listen 80;
    root /files;

    # nginx supports Range requests for static files, so furl downloads
    # anything over 1 MB here in parallel chunks
    location / {
        auth_basic "furl test";
        auth_basic_user_file /etc/nginx/htpasswd;
    }

    # the same files without authentication, for comparison
    location /public/ {
        alias /files/;
    }
}
